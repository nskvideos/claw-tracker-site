<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Chosen Ones</title>
<style>
  :root{
    --ink:#1c1a24;
    --paper:#fbf7ee;
    --panel:#ffffff;
    --line:#e4ddc9;
    --claw:#c2543a;
    --claw-dark:#9c3f2a;
    --win:#2f7a52;
    --alert:#b8321f;
    --muted:#7a7568;
    --track:#efe8d6;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family: ui-sans-serif, "Segoe UI", system-ui, sans-serif;padding:32px 16px 64px;}
  .wrap{max-width:680px;margin:0 auto;}
  header{margin-bottom:24px;}
  h1{font-size:2.2rem;font-weight:800;margin:0 0 4px;letter-spacing:-0.01em;}
  .sub{color:var(--muted);font-size:0.95rem;line-height:1.55;max-width:none;}
  .sub b{color:var(--ink);}

  .global-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px;font-size:0.8rem;color:var(--muted);flex-wrap:wrap;}
  .global-bar .status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:5px;position:relative;top:-1px;}
  .global-bar .status-dot.live{background:var(--win);}

  .loading{padding:40px 20px;text-align:center;color:var(--muted);font-size:0.9rem;}

  .machine{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 22px 18px;margin-bottom:22px;position:relative;}
  .machine.alerting{border-color:var(--alert);box-shadow:0 0 0 3px rgba(184,50,31,0.12);}
  .machine-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;}
  .machine-name{font-size:1.15rem;font-weight:600;background:transparent;border:none;border-bottom:1px dashed transparent;padding:2px 0;width:100%;color:var(--ink);font-family:inherit;}
  .machine-name:hover, .machine-name:focus{border-bottom:1px dashed var(--line);outline:none;}
  .machine-name-static{font-size:1.05rem;font-weight:600;color:var(--ink);padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;}
  .top-actions{display:flex;gap:4px;align-items:center;flex-shrink:0;}
  .icon-btn{background:none;border:none;color:var(--muted);font-size:0.8rem;cursor:pointer;padding:4px 6px;white-space:nowrap;}
  .machine-summary{display:flex;gap:18px;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);}
  .machine-summary{flex-wrap:wrap;}
  .machine-summary .summary-tag{text-transform:none;letter-spacing:normal;font-size:0.85rem;color:var(--ink);}
  .machine-summary .summary-tag.stale{color:var(--alert);}
  .machine-summary b{color:var(--ink);font-size:0.85rem;text-transform:none;letter-spacing:normal;}
  .icon-btn:hover{color:var(--claw-dark);}

  .live-config{background:var(--track);border-radius:10px;padding:12px 14px;margin-bottom:14px;}
  .prize-info{background:#fdf6ec;border:1px solid #f0e6cc;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:0.85rem;color:var(--ink);}
  .prize-info .prize-title-en{font-weight:600;}
  .prize-info .prize-title-ja{color:var(--muted);}
  .prize-info .prize-meta{margin-top:4px;font-size:0.78rem;color:var(--muted);}
  .prize-info .prize-meta b{color:var(--ink);}
  .prize-info .prize-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;}
  .prize-info select{flex:1;min-width:0;max-width:100%;border:1px solid var(--line);background:white;border-radius:6px;padding:7px 8px;font-size:0.82rem;font-family:inherit;color:var(--ink);}
  .prize-info .prize-actions button.ghost{padding:6px 12px;font-size:0.82rem;}
  .prize-label{color:var(--claw-dark);}
  .prize-label.last-chance{color:var(--alert);}
  .quick-links{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .quick-links button{background:white;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:0.8rem;color:var(--claw-dark);cursor:pointer;font-family:inherit;font-weight:600;}
  .quick-links button:hover{border-color:var(--claw);background:#fdf6ec;}
  .link-hint{font-size:0.76rem;margin-top:6px;color:var(--muted);}
  .link-hint.ok{color:var(--win);}
  .link-hint.err{color:var(--alert);}
  .live-config label{display:block;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);margin-bottom:4px;margin-top:8px;}
  .live-config label:first-child{margin-top:0;}
  .live-config input{width:100%;border:1px solid var(--line);background:white;border-radius:6px;padding:7px 9px;font-size:0.85rem;font-family:inherit;}
  .live-config .row{display:flex;gap:10px;}
  .live-config .row > div{flex:1;}
  .live-status{font-size:0.78rem;margin-top:8px;color:var(--muted);}
  .live-status.err{color:var(--alert);}
  .live-status.ok{color:var(--win);}
  .live-fields{display:flex;gap:14px;font-size:0.78rem;color:var(--muted);margin-top:8px;flex-wrap:wrap;}
  .live-fields b{color:var(--ink);}

  .simple-readout{display:flex;gap:14px;margin-bottom:14px;}
  .simple-readout .box{flex:1;background:linear-gradient(135deg, #fbeee7, #fdf6ec);border:1px solid #f0d9c9;border-radius:10px;padding:16px;text-align:center;}
  .simple-readout .box .num{font-size:2.4rem;font-weight:700;color:var(--claw-dark);line-height:1;}
  .simple-readout .box .now-playing{font-size:1.05rem;font-weight:600;color:var(--ink);word-break:break-all;}
  .simple-readout .box .now-playing.none{color:var(--muted);font-weight:500;font-size:0.95rem;}
  .player-tag-friend{color:#2f5fa8;font-weight:700;}
  .player-tag-farmer{color:var(--alert);font-weight:700;}
  .simple-readout .box .cap{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);margin-top:6px;}

  .actions{display:flex;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
  button.primary{background:var(--claw);color:white;border:none;border-radius:8px;padding:9px 16px;font-size:0.9rem;font-weight:600;cursor:pointer;font-family:inherit;}
  button.primary:hover{background:var(--claw-dark);}
  button.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-size:0.9rem;cursor:pointer;color:var(--ink);font-family:inherit;}
  button.ghost:hover{border-color:var(--claw);}
  button.ghost.danger:hover{border-color:var(--alert);color:var(--alert);}

  details{margin-top:10px;}
  summary{cursor:pointer;font-size:0.82rem;color:var(--muted);user-select:none;}
  .history{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;max-height:260px;overflow-y:auto;}
  .step-table{width:100%;border-collapse:collapse;font-size:0.85rem;}
  .step-table th{text-align:left;color:var(--ink);font-weight:600;font-size:0.8rem;padding:8px 10px;border-bottom:2px solid var(--line);}
  .step-table td{padding:8px 10px;color:var(--ink);}
  .step-table tbody tr:nth-child(odd){background:var(--track);}
  .step-table .step-num{width:52px;white-space:nowrap;}
  .step-table .lose-x{color:#8a8a8a;margin-right:2px;}
  .step-table .player-link{color:#2b6fb3;text-decoration:underline;}
  .step-table .time-link{color:#2b6fb3;text-decoration:underline;white-space:nowrap;}
  .step-table tr.win .player-link, .step-table tr.win .time-link{color:var(--alert);font-weight:700;}
  .step-table .trophy{margin-right:3px;}
  .hist-empty{font-size:0.82rem;color:var(--muted);font-style:italic;}
  .who-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
  .who-row input{flex:1;border:1px solid var(--line);background:white;border-radius:6px;padding:6px 9px;font-size:0.85rem;font-family:inherit;}
  .who-row label{font-size:0.72rem;color:var(--muted);white-space:nowrap;}

  .add-machine{display:block;width:100%;padding:14px;border-radius:12px;border:1.5px dashed var(--line);background:none;color:var(--muted);font-size:0.95rem;cursor:pointer;font-family:inherit;margin-bottom:16px;}
  .add-machine:hover{border-color:var(--claw);color:var(--claw-dark);}
  .empty-state{text-align:center;padding:40px 20px;color:var(--muted);font-size:0.9rem;}
  .note{font-size:0.78rem;color:var(--muted);line-height:1.5;margin-top:6px;}

  .play-alert{background:#fff4ef;border:2px solid #f08b6e;border-radius:10px;padding:14px;margin:12px 0;}
  .play-alert-title{font-weight:800;color:#b33b20;margin-bottom:8px;}
  .play-alert-title-row{display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .play-alert-title-row .play-alert-title{margin-bottom:0;}
  .play-alert-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .play-alert-row input[type="number"]{width:180px;border:1px solid var(--line);border-radius:6px;padding:9px;font:inherit;background:#fff;}
  .play-alert-toggle{display:flex;align-items:center;gap:7px;font-weight:700;}
  .play-alert-status{font-size:.82rem;margin-top:7px;color:var(--muted);}
  .play-alert-status.armed{color:#16834a;font-weight:700;}

  .player-list-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:12px 0;}
  .player-list-status{font-size:.82rem;color:var(--muted);}

  .category-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:30px 0 12px;}
  .category-header:first-child{margin-top:6px;}
  .category-header h2{font-size:1.15rem;margin:0;letter-spacing:-0.005em;}
  .category-summary{display:flex;align-items:center;flex-wrap:wrap;gap:8px;}
  .cat-badge{font-style:normal;font-size:0.72rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;}
  .cat-badge.last-chance{background:#fbecc8;color:#8a5a00;}
  .cat-badge.irrelevant{background:rgba(184,50,31,0.1);color:var(--alert);}
  .category-summary{font-size:0.85rem;color:var(--muted);font-style:italic;margin:0 0 16px;}
  .category-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .category-row label{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);white-space:nowrap;}
  .category-row input{flex:1;border:1px solid var(--line);background:white;border-radius:6px;padding:6px 9px;font-size:0.85rem;font-family:inherit;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>The Chosen Ones</h1>
    <div class="sub">For tracking and treasures and stuff. For the people, kawan mahu lagi prizes.</div>
  </header>

  <div class="global-bar" id="globalBar"></div>

  <div class="player-list-bar">
    <button class="ghost" id="retrievePlayersBtn" type="button">Retrieve player list</button>
    <span class="player-list-status" id="playerListStatus">No player list loaded yet.</span>
  </div>

  <button class="add-machine" id="addBtn">+ Add a machine to track</button>

  <div id="machines"><div class="loading">Connecting to relay…</div></div>
</div>

<script>
// ---------------------------------------------------------------------------
// Player-list CSV import — entirely local, unrelated to the relay. Unchanged
// from before.
// ---------------------------------------------------------------------------
const PLAYER_LIST_KEY = 'tc_player_list_v1';
const PLAYER_TAGS_KEY = 'tc_player_tags_v1';
let playerList = {};
let playerTags = {}; // id -> 'friend' | 'farmer' (only these two are styled; anything else is just ignored)
try { playerList = JSON.parse(localStorage.getItem(PLAYER_LIST_KEY) || '{}') || {}; } catch(e) { playerList = {}; }
try { playerTags = JSON.parse(localStorage.getItem(PLAYER_TAGS_KEY) || '{}') || {}; } catch(e) { playerTags = {}; }
function playerNameFor(id){
  const key=String(id || '').trim();
  return playerList[key] || key;
}
function playerTagFor(id){
  return playerTags[String(id || '').trim()] || null;
}
// Wraps a player's display name in a span carrying the tag's color class,
// if they have a recognized tag (friend/farmer) — used only where a player
// is shown as currently active (now playing / in queue), not in history.
function taggedPlayerHtml(id){
  const name = escapeAttr(playerNameFor(id));
  const tag = playerTagFor(id);
  return tag ? `<span class="player-tag-${tag}">${name}</span>` : name;
}
function parsePlayerCsv(text){
  const rows=[]; let row=[], cell='', quoted=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(quoted && c==='"' && n==='"'){ cell+='"'; i++; }
    else if(c==='"'){ quoted=!quoted; }
    else if(c===',' && !quoted){ row.push(cell); cell=''; }
    else if((c==='\n'||c==='\r') && !quoted){
      if(c==='\r' && n==='\n') i++;
      row.push(cell); if(row.some(v=>v.trim())) rows.push(row); row=[]; cell='';
    } else cell+=c;
  }
  row.push(cell); if(row.some(v=>v.trim())) rows.push(row);
  return rows;
}
let playerListSource = null; // 'players.csv' (auto-fetched) or 'a manually uploaded file' — for the status line only
function updatePlayerListStatus(){
  const el=document.getElementById('playerListStatus');
  if(!el) return;
  const n = Object.keys(playerList).length;
  el.textContent = n
    ? `${n} players loaded${playerListSource ? ` (${playerListSource})` : ''}.`
    : 'No player list loaded yet.';
}
// Shared by both the auto-fetch and manual-upload paths: parses CSV text,
// validates it has usable playerID/playerName rows, and — only if valid —
// replaces the stored player list and persists it locally. Throws on
// anything invalid so callers can show their own error message. A third
// "tag" column is optional — only "friend" and "farmer" (case-insensitive)
// are recognized; anything else in that column is just left unstyled.
function applyPlayerCsvText(text, sourceLabel){
  const rows=parsePlayerCsv(text);
  if(!rows.length) throw new Error('The file is empty.');
  let start=0;
  const first=(rows[0][0] || '').replace(/^\ufeff/,'').trim().toLowerCase();
  if(first==='playerid' || first==='player id') start=1;
  const nextNames={};
  const nextTags={};
  for(let i=start;i<rows.length;i++){
    const id=(rows[i][0] || '').trim();
    const name=(rows[i][1] || '').trim();
    const tag=(rows[i][2] || '').trim().toLowerCase();
    if(id && name){
      nextNames[id]=name;
      if(tag === 'friend' || tag === 'farmer') nextTags[id]=tag;
    }
  }
  if(!Object.keys(nextNames).length) throw new Error('No valid playerID, playerName rows were found.');
  playerList=nextNames;
  playerTags=nextTags;
  playerListSource = sourceLabel;
  localStorage.setItem(PLAYER_LIST_KEY, JSON.stringify(playerList));
  localStorage.setItem(PLAYER_TAGS_KEY, JSON.stringify(playerTags));
  updatePlayerListStatus();
}

// ---------------------------------------------------------------------------
// State model
//
// The relay is now the single source of truth for which machines exist, plus
// their livePlays/lastStatus/history/lastAutoWin/prize info — that's
// `serverMachines`, rebuilt from the relay's broadcasts. Everything personal
// (display name override, alert threshold, THREE_CLAW rate, section
// collapse state) stays local, keyed by "machineId:prizeId" in `localPrefs`.
// A machine being added but not yet sent to the relay lives in `drafts`
// until "Connect live" is clicked.
// ---------------------------------------------------------------------------
const PREFS_KEY = 'tc_local_prefs_v1';
const RELAY_URL = 'wss://tc-relay-1.onrender.com';

let loaded = false;
let serverMachines = [];   // full state objects as broadcast by the relay
let localPrefs = {};       // machineKey -> personal settings (see defaultPrefs)
let drafts = [];           // machines being added, not yet tracked by the relay

try{ localPrefs = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}') || {}; }catch(e){ localPrefs = {}; }

// ---------------------------------------------------------------------------
// Categories — grouped by the prize title's prefix (e.g. "Figure - ..." ->
// "Figures"), which is shared relay data, so every browser derives the same
// grouping for free with no relay changes needed for the common case. An
// explicit override (the `category` field the relay broadcasts) takes
// precedence when someone sets one — that IS shared/relay-owned, so a
// manual override is visible to everyone watching, not just the browser
// that set it. Which categories are collapsed/expanded, though, is purely a
// personal display preference and stays local per browser.
const CATEGORY_PREFS_KEY = 'tc_category_prefs_v1';
let categoryPrefs = {};
try{ categoryPrefs = JSON.parse(localStorage.getItem(CATEGORY_PREFS_KEY) || '{}') || {}; }catch(e){ categoryPrefs = {}; }
function getCategoryPrefs(cat){
  if(!categoryPrefs[cat]) categoryPrefs[cat] = {collapsed: false};
  return categoryPrefs[cat];
}
function saveCategoryPrefs(){
  try{ localStorage.setItem(CATEGORY_PREFS_KEY, JSON.stringify(categoryPrefs)); }catch(e){ console.error('Storage error', e); }
}
function deriveCategory(prizeTitleEn){
  const prefix = (prizeTitleEn || '').split(' - ')[0].trim();
  if(!prefix) return 'Others';
  // Naive but good-enough pluralization for prize-title prefixes like
  // "Figure", "Light", "Plushie" — not meant to be linguistically perfect.
  if(/s$/i.test(prefix)) return prefix;
  if(/[^aeiou]y$/i.test(prefix)) return prefix.slice(0, -1) + 'ies';
  return prefix + 's';
}
function categoryFor(server){
  return server.category || deriveCategory(server.prizeTitleEn) || 'Others';
}
function groupMachinesByCategory(list){
  const groups = new Map();
  list.forEach(card => {
    const cat = categoryFor(card.selected);   // a card sits under its selected prize's category
    if(!groups.has(cat)) groups.set(cat, []);
    groups.get(cat).push(card);
  });
  // Stable order (first-seen), but "Others" always sorts last.
  return Array.from(groups.entries())
    .map(([category, machines]) => ({category, machines}))
    .sort((a, b) => (a.category === 'Others') - (b.category === 'Others'));
}

function machineKey(machineId, prizeId){ return `${machineId}:${prizeId}`; }
function uid(){ return 'm_' + Math.random().toString(36).slice(2, 10); }

// ---------------------------------------------------------------------------
// Machine groups — the relay still tracks each machineId:prizeId pair as its
// own record (own count + history). The dashboard shows ONE card per
// machineId, with a prize switcher over that machine's tracked prizes. Which
// prize is selected, and whether the card is collapsed, are personal display
// prefs keyed by machineId.
// ---------------------------------------------------------------------------
const GROUP_PREFS_KEY = 'tc_group_prefs_v1';
let groupPrefs = {};
try{ groupPrefs = JSON.parse(localStorage.getItem(GROUP_PREFS_KEY) || '{}') || {}; }catch(e){ groupPrefs = {}; }
function saveGroupPrefs(){
  try{ localStorage.setItem(GROUP_PREFS_KEY, JSON.stringify(groupPrefs)); }catch(e){ console.error('Storage error', e); }
}
function getGroupPrefs(machineId){
  if(!groupPrefs[machineId]){
    // one-time carry-over of the old per-prize collapsed state
    const wasCollapsed = serverMachines.some(s => s.machineId === machineId && localPrefs[machineKey(s.machineId, s.prizeId)]?.collapsed);
    groupPrefs[machineId] = {selectedPrizeId: null, collapsed: wasCollapsed};
  }
  return groupPrefs[machineId];
}
function buildCards(){
  const byMachine = new Map();
  serverMachines.forEach(s => {
    if(!byMachine.has(s.machineId)) byMachine.set(s.machineId, []);
    byMachine.get(s.machineId).push(s);
  });
  return Array.from(byMachine.entries()).map(([machineId, prizes]) => {
    const gp = getGroupPrefs(machineId);
    const selected = prizes.find(p => p.prizeId === gp.selectedPrizeId) || prizes[0];
    return {machineId, prizes, selected};
  });
}

function defaultPrefs(){
  return {
    name: null,                    // null = fall back to the relay's prize title, then the key
    alertEnabled: false,
    alertPlayTarget: null,
    alertPlayFired: false,

    collapsed: false,
    alertSectionCollapsed: false,
    payoutSectionCollapsed: false,
  };
}
function getPrefs(key){
  if(!localPrefs[key]) localPrefs[key] = defaultPrefs();
  return localPrefs[key];
}
function savePrefs(){
  try{ localStorage.setItem(PREFS_KEY, JSON.stringify(localPrefs)); }catch(e){ console.error('Storage error', e); }
}

function fmtTime(iso){
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function beep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    o.start(); o.stop(ctx.currentTime + 0.5);
  }catch(e){}
}
function notify(title, body){
  if(window.Notification && Notification.permission === 'granted'){
    try{ new Notification(title, {body}); }catch(e){}
  }
}
function playCountAlert(name, livePlays){
  beep();
  notify('Play-count alert', `${name} reached play ${livePlays}.`);
}
// Personal alert threshold — checked locally against whatever livePlays the
// relay just broadcast. alertPlayFired lives in localPrefs so it doesn't
// re-fire every time this machine's update arrives.
function checkPlayCountAlert(prefs, livePlays, name){
  const target = Number(prefs.alertPlayTarget);
  if(prefs.alertEnabled && Number.isInteger(target) && target > 0 &&
     !prefs.alertPlayFired && livePlays >= target){
    prefs.alertPlayFired = true;
    playCountAlert(name, livePlays);
    savePrefs();
  }
}

// ---------------------------------------------------------------------------
// Relay connection — ONE shared WebSocket for every tracked machine, not one
// per machine like before. The relay owns counting/win-detection/history;
// this client only reacts to what it broadcasts.
// ---------------------------------------------------------------------------
let socket = null;
let reconnectTimer = null;
let socketStatus = {ok:false, msg:'Connecting to relay…'};

function connectRelay(){
  if(socket) return;
  try{
    socket = new WebSocket(RELAY_URL);
  }catch(e){
    socketStatus = {ok:false, msg:'Could not open WebSocket: ' + e.message};
    render();
    scheduleReconnect();
    return;
  }

  socket.onopen = () => {
    socketStatus = {ok:true, msg:'Connected to relay'};
    sendToRelay({type:'listMachines'});
    render();
  };

  socket.onmessage = (ev) => {
    let msg;
    try{ msg = JSON.parse(ev.data); }catch(e){ return; }

    if(msg.type === 'machineList'){
      serverMachines = msg.data || [];
      render();
    } else if(msg.type === 'machineUpdate'){
      const key = machineKey(msg.data.machineId, msg.data.prizeId);
      const idx = serverMachines.findIndex(x => machineKey(x.machineId, x.prizeId) === key);
      const prev = idx >= 0 ? serverMachines[idx] : null;
      handleIncomingMachineUpdate(prev, msg.data, key);
      if(idx >= 0) serverMachines[idx] = msg.data; else serverMachines.push(msg.data);
      render();
    } else if(msg.type === 'machineRemoved'){
      const key = machineKey(msg.data.machineId, msg.data.prizeId);
      serverMachines = serverMachines.filter(x => machineKey(x.machineId, x.prizeId) !== key);
      render();
    } else if(msg.type === 'trackingError'){
      alert('Could not start tracking: ' + ((msg.data && msg.data.message) || 'unknown error'));
    }
    // 'ping' and anything else from the relay is a no-op here.
  };

  socket.onerror = () => {
    socketStatus = {ok:false, msg:'WebSocket error — the relay may be waking up (Render free tier sleeps when idle) or unreachable.'};
    render();
  };

  socket.onclose = () => {
    socket = null;
    socketStatus = {ok:false, msg:'Disconnected from relay. Reconnecting in 5s…'};
    render();
    scheduleReconnect();
  };
}

function scheduleReconnect(){
  if(reconnectTimer) return;
  reconnectTimer = setTimeout(() => { reconnectTimer = null; connectRelay(); }, 5000);
}

function sendToRelay(obj){
  if(socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(obj));
}

// Local-only side effects of a machineUpdate: sound/notification alerts and
// the THREE_CLAW payout math both depend on this browser's personal
// settings, so they're computed here rather than trusted from the server.
function handleIncomingMachineUpdate(prev, next, key){
  const prefs = getPrefs(key);
  const name = prefs.name || next.prizeTitleEn || next.prizeTitleJa || key;

  const prevWinTime = prev && prev.lastAutoWin ? prev.lastAutoWin.time : null;
  const nextWinTime = next.lastAutoWin ? next.lastAutoWin.time : null;
  if(nextWinTime && nextWinTime !== prevWinTime){
    beep();
    notify(`${name}: win detected!`, `Won after ${next.lastAutoWin.count} play${next.lastAutoWin.count === 1 ? '' : 's'} — ${playerNameFor(next.lastAutoWin.player) || 'unknown player'}.`);
    // THREE_CLAW payout math is computed by the relay now (shared —
    // next.threeClawPayout/threeClawLastPayoutOwed arrive already updated
    // in this same broadcast), not here.
    prefs.alertPlayFired = false; // a new session is starting — re-arm the play-count alert for it
    savePrefs();
  }

  checkPlayCountAlert(prefs, next.livePlays, name);
}

function notificationStatusLabel(){
  if(!window.Notification) return 'Desktop notifications: not supported by this browser';
  if(Notification.permission === 'granted') return 'Desktop notifications: enabled ✓';
  if(Notification.permission === 'denied') return 'Desktop notifications: blocked — check the padlock icon next to the address bar, or your OS notification settings for this browser';
  return 'Desktop notifications: not yet enabled — click "Enable browser notifications" on any card';
}

function updateGlobalBar(){
  const bar = document.getElementById('globalBar');
  if(!loaded){ bar.innerHTML = ''; return; }
  const staleCount = serverMachines.filter(x => x.prizeStale).length;
  bar.innerHTML = `
    <div><span class="status-dot ${socketStatus.ok ? 'live' : ''}"></span>${escapeAttr(socketStatus.msg)}</div>
    <div>${new Set(serverMachines.map(x => x.machineId)).size} machine${new Set(serverMachines.map(x => x.machineId)).size === 1 ? '' : 's'} (${serverMachines.length} prize${serverMachines.length === 1 ? '' : 's'}) tracked — shared with everyone watching this dashboard</div>
    <div style="${staleCount ? 'color:var(--alert);font-weight:600;' : ''}">${staleCount} irrelevant prize${staleCount === 1 ? '' : 's'} (no longer on their machine)</div>
    <div>${escapeAttr(notificationStatusLabel())}</div>
  `;
}

function escapeAttr(s){ return String(s ?? '').replace(/"/g, '&quot;'); }

function tokyoCatchUrl(m){
  return `https://tokyocatch.com/game/${m.machineId}-${m.prizeId}`;
}
function torebaPlusUrl(m){
  return `https://toreba.plus/annex/tkcatchhistory?mid=${encodeURIComponent(m.machineId + '-' + m.prizeId)}&pid=${encodeURIComponent(m.prizeId)}`;
}
function openPopup(url){
  const newTab = window.open(url, '_blank');
  if(newTab){ newTab.opener = null; }
}

const HEX24 = /^[0-9a-f]{24}$/i;

function render(){
  updateGlobalBar();
  const root = document.getElementById('machines');
  root.innerHTML = '';
  if(!loaded){ root.innerHTML = '<div class="loading">Connecting to relay…</div>'; return; }

  if(drafts.length === 0 && serverMachines.length === 0){
    root.innerHTML = '<div class="empty-state">No machines yet. Add one below to start tracking.</div>';
    return;
  }

  // Drafts (not yet sent to the relay) render ungrouped, above every
  // category, since they don't have relay-confirmed prize data to derive a
  // category from yet.
  drafts.forEach(d => {
    const card = document.createElement('div');
    card.className = 'machine';
    card.innerHTML = renderDraftCard(d);
    root.appendChild(card);
  });

  groupMachinesByCategory(buildCards()).forEach(({category, machines}) => {
    const section = document.createElement('div');
    section.innerHTML = renderCategorySection(category, machines);
    root.appendChild(section);
  });
}

function renderCategorySection(category, machines){
  const catPrefs = getCategoryPrefs(category);
  const escCat = escapeAttr(category);
  const count = machines.length;
  // extra counts are over every prize on the cards in this section, not just the one currently shown
  const allPrizes = machines.flatMap(c => c.prizes);
  const staleCount = allPrizes.filter(p => p.prizeStale).length;
  const lastChanceCount = allPrizes.filter(p => p.prizeLabel === 'LAST_CHANCE').length;
  const extraHtml =
    (lastChanceCount ? `<span class="cat-badge last-chance">${lastChanceCount} last chance</span>` : '') +
    (staleCount ? `<span class="cat-badge irrelevant">${staleCount} irrelevant</span>` : '');

  if(catPrefs.collapsed){
    return `
      <div class="category-header">
        <h2>${escCat}</h2>
        <button class="icon-btn" data-action="toggle-category" data-category="${escCat}">Expand ▾</button>
      </div>
      <div class="category-summary"><span>currently tracking ${count} item${count === 1 ? '' : 's'}</span>${extraHtml}</div>
    `;
  }

  let html = `
    <div class="category-header">
      <h2>${escCat}</h2>
      <button class="icon-btn" data-action="toggle-category" data-category="${escCat}">Collapse ▲</button>
    </div>
  `;
  machines.forEach(card => {
    const server = card.selected;
    const key = machineKey(server.machineId, server.prizeId);
    const prefs = getPrefs(key);
    html += `<div class="machine${server.prizeStale ? ' alerting' : ''}">${renderTrackedCard(server, prefs, key, card.prizes)}</div>`;
  });
  return html;
}

function renderDraftCard(d){
  const idsValid = HEX24.test(d.machineId || '') && HEX24.test(d.prizeId || '');
  const sameMachine = idsValid && serverMachines.some(s => s.machineId === d.machineId);
  const sibling = sameMachine ? buildCards().find(c => c.machineId === d.machineId) : null;
  const catPlaceholder = sibling
    ? `${categoryFor(sibling.selected)} (same as this machine's existing card)`
    : 'Auto-detected from the prize title';
  return `
    <div class="machine-top">
      <input class="machine-name" value="${escapeAttr(d.name || '')}" placeholder="New machine" data-draft="${d.id}" data-field="name" />
      <div class="top-actions">
        <button class="icon-btn" data-draft="${d.id}" data-action="remove-draft">Remove</button>
      </div>
    </div>
    <div class="category-row">
      <label>Category</label>
      <input type="text" value="${escapeAttr(d.category || '')}" placeholder="${escapeAttr(catPlaceholder)}" data-draft="${d.id}" data-field="category" />
    </div>
    <div class="link-hint" style="margin-top:-8px;margin-bottom:14px;">Shared — moves this card for everyone watching. Leave blank to auto-detect from the prize title.</div>
    <div class="live-config">
      <label>TokyoCatch prize link</label>
      <input type="text" placeholder="Paste a TokyoCatch game link here, e.g. https://tokyocatch.com/game/686abfea206128473c01e7dd-6a8409305d57c7003f6844ea" value="${escapeAttr(d.gameLink || '')}" data-draft="${d.id}" data-field="gameLink" />
      <div class="row">
        <div><label>Machine ID</label><input type="text" placeholder="Machine ID" value="${escapeAttr(d.machineId || '')}" data-draft="${d.id}" data-field="machineId" /></div>
        <div><label>Prize ID</label><input type="text" placeholder="Prize ID" value="${escapeAttr(d.prizeId || '')}" data-draft="${d.id}" data-field="prizeId" /></div>
      </div>
      <div class="link-hint ${idsValid ? 'ok' : 'err'}">
        ${idsValid
          ? (sameMachine ? 'This machine is already on the dashboard — this prize will be added to its existing card (switch with Change Prize). Click Connect live to start tracking it.' : 'IDs detected — click Connect live to start tracking. This will be visible to everyone watching this dashboard.')

      </div>

        <button class="primary" style="width:100%;" data-draft="${d.id}" data-action="connect-live">Connect live</button>
      </div>
    </div>
  `;
}

      <div class="play-alert-title" style="color:#8a2c1c;">⚠️ Prize no longer on this machine</div>
      <div style="font-size:0.85rem;color:var(--ink);line-height:1.5;">
        TokyoCatch reports <b>IrrelevantPrizeForMachine</b> — this machine has moved on to a different prize than the one being tracked here (Prize ID <code>${escapeAttr(server.prizeId)}</code>). ${server.dataSinceStale ? 'Plays are <b>still being counted</b> for everyone watching, but they may belong to the machine\'s new prize.' : 'TokyoCatch is <b>not sending play data</b> for this prize any more, so <b>no new plays are being counted</b> here. Your existing count and history are kept.'} To track the machine's current prize, add its link with "+ Add a machine to track" — it will join this card.
      </div>

    <div class="prize-info">
      ${server.prizeTitleEn ? `<div class="prize-title-en">${escapeAttr(server.prizeTitleEn)}</div>` : ''}
      ${server.prizeTitleJa ? `<div class="prize-title-ja">${escapeAttr(server.prizeTitleJa)}</div>` : ''}

      ${server.lastFields ? `<div class="live-fields"><span>status: <b>${escapeAttr(lastFields.status || '—')}</b></span><span>viewers: <b>${lastFields.viewerCount ?? '—'}</b></span><span>maintenance: <b>${lastFields.isMaintenance ? 'yes' : 'no'}</b></span>${lastFields.currentPlayingUser ? `<span>current player: <b>${taggedPlayerHtml(lastFields.currentPlayingUser.id)}</b></span>` : ''}</div>` : ''}

          `<table class="step-table">
            <thead><tr><th class="step-num">Step</th><th>Played by</th><th>Play time</th></tr></thead>
            <tbody>
            ${history.slice().reverse().slice(0,80).map(h => `
              <tr class="${h.isWin ? 'win' : ''}">
                <td class="step-num">${h.step}: ${h.isWin ? '<span class="trophy">🏆</span>' : '<span class="lose-x">✕</span>'}</td>
                <td>${h.player ? `<span class="player-link">${taggedPlayerHtml(h.player)}</span>` : '<span style="color:var(--muted);font-style:italic;">unknown</span>'}</td>

}

document.getElementById('addBtn').addEventListener('click', () => {
  drafts.unshift({id: uid(), name: '', machineId: '', prizeId: '', gameLink: '', category: ''});
  render();
});

document.getElementById('machines').addEventListener('input', (e) => {
  const field = e.target.dataset.field;
  if(!field) return;
  const draftId = e.target.dataset.draft;
  const key = e.target.dataset.key;

  if(draftId){
    const d = drafts.find(x => x.id === draftId);
    if(!d) return;
    d[field] = e.target.value;
    if(field === 'name' || field === 'category') return;   // nothing else on the card depends on these — skip the re-render so typing keeps focus
    if(field === 'gameLink'){
      const m = e.target.value.match(/(?:https?:\/\/)?(?:www\.)?tokyocatch\.com\/game\/([0-9a-f]{24})-([0-9a-f]{24})/i);
      if(m){ d.machineId = m[1]; d.prizeId = m[2]; d.gameLink = `https://tokyocatch.com/game/${d.machineId}-${d.prizeId}`; }
    }
    if(field === 'machineId' || field === 'prizeId'){
      const m = e.target.value.match(/\/game\/([0-9a-f]{24})-([0-9a-f]{24})/i);
      if(m){ d.machineId = m[1]; d.prizeId = m[2]; d.gameLink = `https://tokyocatch.com/game/${d.machineId}-${d.prizeId}`; }
    }
    render();
    return;
  }

  if(!key) return;
  const prefs = getPrefs(key);
  const server = serverMachines.find(x => machineKey(x.machineId, x.prizeId) === key);

  if(field === 'alertEnabled'){
    prefs.alertEnabled = e.target.checked;
    savePrefs();
    if(prefs.alertEnabled && server) checkPlayCountAlert(prefs, server.livePlays, prefs.name || key);
    render(); return;
  }
  if(field === 'alertPlayTarget'){
    const v = Number(e.target.value);
    prefs.alertPlayTarget = Number.isInteger(v) && v > 0 ? v : null;
    prefs.alertPlayFired = false;
    savePrefs(); return;
  }
  if(field === 'name'){
    prefs.name = e.target.value || null;
    savePrefs(); return;
  }
  if((field === 'gameLink' || field === 'machineId' || field === 'prizeId') && server){
    // Recovery path for a stale-prize warning: point this card at a
    // different machine/prize. Since the relay identifies machines by
    // machineId:prizeId, this means stop-tracking the old pair and
    // start-tracking the new one, carrying this card's personal settings
    // (name, alert, payout rate) across to the new key.
    let newMachineId = server.machineId, newPrizeId = server.prizeId;
    const val = e.target.value;
    if(field === 'gameLink'){
      const m = val.match(/(?:https?:\/\/)?(?:www\.)?tokyocatch\.com\/game\/([0-9a-f]{24})-([0-9a-f]{24})/i);
      if(m){ newMachineId = m[1]; newPrizeId = m[2]; }
    } else if(field === 'machineId'){
      const m = val.match(/\/game\/([0-9a-f]{24})-([0-9a-f]{24})/i);
      newMachineId = m ? m[1] : val;
      if(m) newPrizeId = m[2];
    } else if(field === 'prizeId'){
      const m = val.match(/\/game\/([0-9a-f]{24})-([0-9a-f]{24})/i);
      newPrizeId = m ? m[2] : val;
      if(m) newMachineId = m[1];
    }
    if(HEX24.test(newMachineId) && HEX24.test(newPrizeId)){
      const newKey = machineKey(newMachineId, newPrizeId);
      if(newKey !== key){
        const alreadyTracked = serverMachines.some(x => machineKey(x.machineId, x.prizeId) === newKey);
        if(!alreadyTracked){
          localPrefs[newKey] = prefs;
          delete localPrefs[key];
          savePrefs();
          sendToRelay({type:'stopTracking', data:{machineId: server.machineId, prizeId: server.prizeId}});
          sendToRelay({type:'startTracking', data:{machineId: newMachineId, prizeId: newPrizeId}});
        }
        // If that prize is already tracked, just switch this card to it.
        getGroupPrefs(newMachineId).selectedPrizeId = newPrizeId;
        saveGroupPrefs();
        if(alreadyTracked) render();
      }
    }
  }
});

// Separate from the 'input' listener above (which fires on every
// keystroke): these fields are shared, so they only send to the relay on
// 'change' (i.e. on blur/Enter) — no reason to spam the relay with an
// update while someone is still mid-typing.
document.getElementById('machines').addEventListener('change', (e) => {
  const field = e.target.dataset.field;
  const key = e.target.dataset.key;
  if(field === 'switchPrize'){
    getGroupPrefs(e.target.dataset.machine).selectedPrizeId = e.target.value;
    saveGroupPrefs();
    render();
    return;
  }
  if(!key) return;
  const server = serverMachines.find(x => machineKey(x.machineId, x.prizeId) === key);
  if(!server) return;

  if(field === 'category'){
    const val = e.target.value.trim();
    sendToRelay({type:'setCategory', data:{machineId: server.machineId, prizeId: server.prizeId, category: val || null}});
    return;
  }
  if(field === 'threeClawUsualRate'){
    const v = Number(e.target.value);
    const rate = Number.isFinite(v) && v > 0 ? v : null;
    sendToRelay({type:'payoutAction', data:{machineId: server.machineId, prizeId: server.prizeId, action:'setRate', value: rate}});
    return;
  }
  if(field === 'threeClawLastPayoutOwed'){
    const v = Number(e.target.value);
    const owed = Number.isFinite(v) ? v : null;
    sendToRelay({type:'payoutAction', data:{machineId: server.machineId, prizeId: server.prizeId, action:'setOwed', value: owed}});
    return;
  }
});

document.getElementById('machines').addEventListener('click', (e) => {
  const action = e.target.dataset.action;
  if(!action) return;

  if(action === 'toggle-category'){
    const cat = e.target.dataset.category;
    const cp = getCategoryPrefs(cat);
    cp.collapsed = !cp.collapsed;
    saveCategoryPrefs();
    render();
    return;
  }

  const draftId = e.target.dataset.draft;
  const key = e.target.dataset.key;

  if(draftId){
    const d = drafts.find(x => x.id === draftId);
    if(!d) return;
    if(action === 'remove-draft'){ drafts = drafts.filter(x => x.id !== draftId); render(); return; }
    if(action === 'connect-live'){
      if(!HEX24.test(d.machineId || '') || !HEX24.test(d.prizeId || '')){
        alert('Enter a valid TokyoCatch prize link, or both 24-character IDs, first.');
        return;
      }
      const key2 = machineKey(d.machineId, d.prizeId);
      if(d.name) getPrefs(key2).name = d.name;
      savePrefs();
      // Blank category: if this machine already has a card with an explicit
      // category, reuse it so the card doesn't jump to another section.
      const siblingCat = (serverMachines.find(x => x.machineId === d.machineId && x.category) || {}).category || null;
      const category = (d.category || '').trim() || siblingCat;
      sendToRelay({type:'startTracking', data:{machineId: d.machineId, prizeId: d.prizeId, category}});
      getGroupPrefs(d.machineId).selectedPrizeId = d.prizeId;   // joins the machine's card and becomes the shown prize
      saveGroupPrefs();
      drafts = drafts.filter(x => x.id !== draftId);
      render();
      return;
    }
    return;
  }

  if(!key) return;
  const prefs = getPrefs(key);
  const server = serverMachines.find(x => machineKey(x.machineId, x.prizeId) === key);
  if(!server) return;
  const displayName = prefs.name || server.prizeTitleEn || server.prizeTitleJa || key;

  if(action === 'set-alert'){
    const input = document.querySelector(`input[data-key="${key}"][data-field="alertPlayTarget"]`);
    const v = Number(input && input.value);
    if(!Number.isInteger(v) || v < 1){ alert('Enter a whole play number greater than 0.'); return; }
    prefs.alertPlayTarget = v; prefs.alertPlayFired = false;
    savePrefs(); checkPlayCountAlert(prefs, server.livePlays, displayName); render(); return;
  }
  if(action === 'test-alert'){ playCountAlert(displayName, server.livePlays); return; }
  if(action === 'clear-alert'){ prefs.alertPlayTarget = null; prefs.alertPlayFired = false; savePrefs(); render(); return; }
  if(action === 'remove'){
    if(!confirm(`Remove prize "${displayName}"? This is shared — it will stop counting for everyone watching this dashboard. Any other prizes on this machine keep tracking.`)) return;
    sendToRelay({type:'stopTracking', data:{machineId: server.machineId, prizeId: server.prizeId}});
    delete localPrefs[key]; savePrefs();
    const otherPrizes = serverMachines.some(x => x.machineId === server.machineId && x.prizeId !== server.prizeId);
    if(otherPrizes){
      const gp = getGroupPrefs(server.machineId);
      if(gp.selectedPrizeId === server.prizeId) gp.selectedPrizeId = null;
    } else {
      delete groupPrefs[server.machineId];
    }
    saveGroupPrefs();
    return;
  }
  if(action === 'toggle-collapse'){ const gp = getGroupPrefs(server.machineId); gp.collapsed = !gp.collapsed; saveGroupPrefs(); render(); return; }
  if(action === 'toggle-alert-section'){ prefs.alertSectionCollapsed = !prefs.alertSectionCollapsed; savePrefs(); render(); return; }
  if(action === 'toggle-payout-section'){ prefs.payoutSectionCollapsed = !prefs.payoutSectionCollapsed; savePrefs(); render(); return; }
  if(action === 'open-tokyocatch'){ openPopup(tokyoCatchUrl(server)); return; }
  if(action === 'open-toreba'){ openPopup(torebaPlusUrl(server)); return; }
  if(action === 'notifperm'){
    if(window.Notification && Notification.permission !== 'granted'){
      Notification.requestPermission().then(() => render());
    }
    return;
  }
  if(action === 'compute-payout'){
    const rate = Number(server.threeClawUsualRate);
    const lastOwed = Number(server.threeClawLastPayoutOwed);
    if(!Number.isFinite(rate) || rate <= 0){ alert('Enter a valid Usual Payout rate first.'); return; }
    if(!Number.isFinite(lastOwed)){ alert('Enter a valid Last Payout owed value first.'); return; }
    sendToRelay({type:'payoutAction', data:{machineId: server.machineId, prizeId: server.prizeId, action:'compute'}});
    return;
  }
  if(action === 'reset-payout'){
    sendToRelay({type:'payoutAction', data:{machineId: server.machineId, prizeId: server.prizeId, action:'reset'}});
    return;
  }
});

// Fetches players.csv from this same site — it's a static site, so a
// players.csv file committed into the site's own GitHub repo, right
// alongside index.html, is served at this same relative URL automatically.
// No per-person file needed; everyone always gets whatever the repo
// currently has.
document.getElementById('retrievePlayersBtn').addEventListener('click', async () => {
  const btn = document.getElementById('retrievePlayersBtn');
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Retrieving…';
  try{
    const res = await fetch('players.csv', {cache: 'no-store'});
    if(!res.ok) throw new Error(`players.csv not found on this site (HTTP ${res.status}). Ask whoever maintains the dashboard to add it to the GitHub repo.`);
    applyPlayerCsvText(await res.text(), 'from players.csv on this site');
    render();
  }catch(err){
    alert('Could not retrieve the shared player list: ' + err.message);
  }finally{
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
});
updatePlayerListStatus();

// Chrome/Safari block audio that isn't triggered by a direct user gesture.
// Since alerts fire from WebSocket messages (not clicks), the very first
// automatic alert can get silently blocked. One click or keypress anywhere
// on the page unlocks audio for the rest of the session.
let audioUnlocked = false;
function unlockAudioOnce(){
  if(audioUnlocked) return;
  audioUnlocked = true;
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    if(ctx.state === 'suspended') ctx.resume();
  }catch(e){}
}
document.addEventListener('click', unlockAudioOnce, {once:true});
document.addEventListener('keydown', unlockAudioOnce, {once:true});

loaded = true;
render();
connectRelay();
</script>
